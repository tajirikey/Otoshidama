<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <title>お年玉管理（2アカウント）</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root{
      --bg:#f8fafc;
      --bg-gradient:#e0f2fe;
      --card:#ffffff;
      --card2:#f1f5f9;
      --text:#1e293b;
      --muted:#64748b;
      --accent:#3b82f6;
      --danger:#ef4444;
      --ok:#10b981;
      --border:rgba(148,163,184,.25);
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.08);
      --radius:16px;
      --pad:16px;
      --safeTop: env(safe-area-inset-top, 0px);
      --safeBottom: env(safe-area-inset-bottom, 0px);
      --meter-bg: #e2e8f0;
      --meter-fill: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%);
      --meter-warn: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
      --meter-danger: linear-gradient(90deg, #ef4444 0%, #f87171 100%);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg-gradient) 0%, var(--bg) 100%) fixed;
      min-height: 100vh;
    }
    a{color:inherit}
    .wrap{
      max-width: 720px;
      margin: 0 auto;
      padding: calc(var(--safeTop) + 14px) 14px calc(var(--safeBottom) + 22px);
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .title{
      display:flex; flex-direction:column; gap:4px;
    }
    .title h1{
      font-size:18px; margin:0; letter-spacing:.2px; color:var(--text);
    }
    .title .sub{
      font-size:12px; color:var(--muted);
    }
    .seg{
      display:inline-flex;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow:hidden;
    }
    .seg button{
      appearance:none;
      border:0;
      background:transparent;
      color:var(--muted);
      padding:10px 14px;
      font-weight:700;
      font-size:13px;
      cursor:pointer;
      min-width:86px;
      transition: all .15s;
    }
    .seg button.active{
      color:#fff;
      background: var(--accent);
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card .inner{padding: var(--pad);}
    .balance{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .balance .label{color:var(--muted); font-size:12px; margin-bottom:6px; font-weight:700;}
    .balance .amount{
      font-size:34px;
      font-weight:800;
      letter-spacing: .2px;
      line-height: 1.05;
      word-break: break-word;
      color:var(--text);
    }
    .badge{
      font-size:12px;
      padding:6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--card2);
      white-space:nowrap;
      font-weight:700;
    }

    /* メーター */
    .meter-wrap{
      margin-top: 14px;
    }
    .meter-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
      font-weight:700;
      display:flex;
      justify-content:space-between;
      align-items:baseline;
    }
    .meter-label .ratio{
      font-size:11px;
      color:var(--muted);
    }
    .meter{
      width:100%;
      height:12px;
      background: var(--meter-bg);
      border-radius: 999px;
      overflow:hidden;
      position:relative;
    }
    .meter-bar{
      height:100%;
      background: var(--meter-fill);
      border-radius: 999px;
      transition: width .3s ease, background .3s ease;
    }
    .meter-bar.warn{
      background: var(--meter-warn);
    }
    .meter-bar.danger{
      background: var(--meter-danger);
    }

    .stats{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top: 12px;
    }
    .stat{
      background: var(--card2);
      border:1px solid var(--border);
      border-radius: 14px;
      padding:12px;
    }
    .stat .k{font-size:12px;color:var(--muted); margin-bottom:6px; font-weight:700;}
    .stat .v{font-size:16px;font-weight:800;}
    .v.income{color:var(--ok)}
    .v.expense{color:var(--danger)}
    .actions{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin: 12px 0 0;
    }
    .btn{
      appearance:none;
      border:0;
      cursor:pointer;
      border-radius: 14px;
      padding: 12px 12px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing:.1px;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--text);
      transition: all .15s;
    }
    .btn:hover{
      background: var(--border);
    }
    .btn.primary{
      background: var(--accent);
      border-color: var(--accent);
      color:#fff;
    }
    .btn.primary:hover{
      background: #2563eb;
      border-color: #2563eb;
    }
    .btn.danger{
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .btn.danger:hover{
      background: #dc2626;
      border-color: #dc2626;
    }
    .btn:active{transform: translateY(1px)}
    .btn.small{padding:10px 11px;font-size:13px;border-radius:12px}
    .btn.ghost{
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
      font-weight:700;
    }
    .btn.ghost:hover{
      background: var(--card2);
    }

    .section{
      margin-top: 14px;
    }
    .section h2{
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
      letter-spacing:.2px;
    }

    .list{
      overflow:hidden;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: transparent;
      cursor:pointer;
      transition: background .15s;
    }
    .row:hover{
      background: var(--card2);
    }
    .row:first-child{border-top:0}
    .row .left{
      display:flex; flex-direction:column; gap:4px;
      min-width: 0;
    }
    .row .topline{
      display:flex; gap:10px; align-items:baseline;
      min-width:0;
    }
    .date{
      font-size:12px;
      color: var(--muted);
      min-width: 52px;
      flex: 0 0 auto;
      font-weight:600;
    }
    .cat{
      font-size:12px;
      padding: 3px 8px;
      border:1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--card2);
      flex: 0 0 auto;
      font-weight:600;
    }
    .memo{
      font-size:14px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 52vw;
      color:var(--text);
    }
    .row .amt{
      font-size:14px;
      font-weight:900;
      white-space:nowrap;
    }
    .amt.income{color:var(--ok)}
    .amt.expense{color:var(--danger)}

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .chips{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .chip{
      border:1px solid var(--border);
      background: var(--card2);
      color: var(--muted);
      padding:8px 11px;
      border-radius:999px;
      font-weight:800;
      font-size:12px;
      cursor:pointer;
      transition: all .15s;
    }
    .chip:hover{
      background: var(--border);
    }
    .chip.active{
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .footerline{
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      margin-top: 10px;
      color: var(--muted);
      font-size:12px;
      font-weight:600;
    }

    /* Modal */
    .overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.35);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 12px 12px calc(var(--safeBottom) + 12px);
      z-index: 50;
      backdrop-filter: blur(4px);
    }
    .overlay.show{display:flex}
    .sheet{
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      overflow:hidden;
      max-height: calc(100vh - var(--safeTop) - var(--safeBottom) - 24px);
      overflow-y: auto;
    }
    .sheet header{
      margin:0;
      padding: 12px 14px;
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
      background: var(--card2);
    }
    .sheet header .h{
      font-weight:900;
      font-size:14px;
      color:var(--text);
    }
    .sheet header .x{
      appearance:none;border:0;background:transparent;color:var(--muted);
      font-size:18px;font-weight:900;cursor:pointer;padding:6px 8px;border-radius:10px;
      transition: all .15s;
    }
    .sheet header .x:hover{
      background: var(--border);
    }
    .sheet .body{padding:14px}
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      align-items: start;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:10px;
    }
    .field.full{
      grid-column: 1 / -1;
    }
    .field label{
      font-size:12px;
      color: var(--muted);
      font-weight:800;
    }
    input, select, textarea{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline:none;
      font-family: inherit;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus{
      border-color: var(--accent);
    }
    textarea{min-height: 82px; resize: vertical;}
    input::placeholder, textarea::placeholder{color: var(--muted); opacity:.7}
    .sheet .actionsRow{
      display:flex; gap:10px;
      padding: 0 14px 14px;
    }
    .sheet .actionsRow .btn{flex:1}
    .hint{
      margin-top:8px;
      font-size:12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .divider{
      height:1px;
      background: var(--border);
      margin: 12px 0;
    }

    /* プレビューメーター */
    .preview-meter{
      margin-top:12px;
      padding:12px;
      background: var(--card2);
      border:1px solid var(--border);
      border-radius: 14px;
      display:none;
    }
    .preview-meter.show{
      display:block;
    }
    .preview-meter .title{
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
      font-weight:700;
    }
    .preview-meter .value{
      font-size:20px;
      font-weight:800;
      margin-bottom:10px;
    }
    .preview-meter .value.positive{color:var(--ok)}
    .preview-meter .value.negative{color:var(--danger)}

    /* small top alert */
    .toast{
      position: fixed;
      top: calc(var(--safeTop) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--text);
      box-shadow: var(--shadow-lg);
      font-size: 13px;
      font-weight: 800;
      display:none;
      z-index: 60;
      max-width: calc(100% - 24px);
      white-space: nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .toast.show{display:block}

    .login-screen{
      position:fixed;
      inset:0;
      background: linear-gradient(180deg, var(--bg-gradient) 0%, var(--bg) 100%);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:100;
      padding:20px;
    }
    .login-screen.show{display:flex}
    .login-box{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding:32px;
      width:min(400px, 100%);
      text-align:center;
    }
    .login-box h2{
      margin:0 0 12px;
      font-size:20px;
      color:var(--text);
    }
    .login-box .subtitle{
      font-size:14px;
      color:var(--muted);
      margin-bottom:0;
    }
    .spinner{
      margin:24px auto 16px;
      width:40px;
      height:40px;
      border:3px solid var(--border);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin 1s linear infinite;
    }
    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    @media (max-width: 420px){
      .balance .amount{font-size: 30px}
      .memo{max-width: 48vw}
      .seg button{min-width:80px; padding:10px 12px}
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <!-- ローディング画面 -->
  <div class="login-screen show" id="loginScreen">
    <div class="login-box">
      <h2>お年玉管理</h2>
      <div class="spinner" id="spinner"></div>
      <div class="subtitle" id="loadingMessage">読み込み中...</div>
      <div id="errorDetail" style="margin-top:16px;font-size:12px;color:var(--danger);display:none;text-align:left;background:rgba(239,68,68,.1);padding:12px;border-radius:12px;"></div>
    </div>
  </div>

  <div class="wrap" id="mainApp" style="display:none">
    <header>
      <div class="title">
        <h1>お年玉管理</h1>
        <div class="sub">さやとせいやの共有アカウント</div>
      </div>

      <div class="seg" id="accountSeg">
        <button type="button" data-account="a">さや</button>
        <button type="button" data-account="b">せいや</button>
      </div>
    </header>

    <div class="card">
      <div class="inner">
        <div class="balance">
          <div>
            <div class="label">あといくら</div>
            <div class="amount" id="balanceAmt">¥0</div>
          </div>
          <div class="badge" id="periodBadge">今年</div>
        </div>

        <!-- 残額メーター -->
        <div class="meter-wrap">
          <div class="meter-label">
            <span>残額メーター</span>
            <span class="ratio" id="meterRatio">0%</span>
          </div>
          <div class="meter">
            <div class="meter-bar" id="meterBar" style="width:0%"></div>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="k">入金合計</div>
            <div class="v income" id="incomeSum">¥0</div>
          </div>
          <div class="stat">
            <div class="k">支出合計</div>
            <div class="v expense" id="expenseSum">¥0</div>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" id="addIncomeBtn">入金を追加</button>
          <button class="btn" id="addExpenseBtn">支出を追加</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="toolbar">
        <h2 style="margin:0">明細</h2>
        <button class="btn small ghost" id="openAllBtn">一覧を見る</button>
      </div>

      <div class="card list" id="recentList">
        <!-- rows -->
      </div>

      <div class="footerline">
        <div id="countInfo">0件</div>
        <button class="btn small ghost" id="backupBtn">バックアップ</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add/Edit -->
  <div class="overlay" id="modalOverlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header>
        <div class="h" id="modalTitle">入力</div>
        <button class="x" id="closeModalBtn" aria-label="閉じる">×</button>
      </header>
      <div class="body" id="modalBody">
        <!-- dynamic -->
      </div>
      <div class="actionsRow" id="modalActions">
        <!-- dynamic -->
      </div>
    </div>
  </div>

  <script>
    (() => {
      // Firebase設定（自分のプロジェクト情報に置き換えてください）
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      // Firebase設定チェック
      function checkFirebaseConfig(){
        if(firebaseConfig.apiKey === "YOUR_API_KEY"){
          const msg = document.createElement("div");
          msg.innerHTML = `
            <strong>Firebase設定が必要です</strong><br><br>
            1. <a href="https://console.firebase.google.com/" target="_blank" style="color:var(--accent)">Firebase Console</a> でプロジェクトを作成<br>
            2. Authentication を有効化（メール/パスワード）<br>
            3. Firestore Database を作成<br>
            4. プロジェクト設定から設定値を取得<br>
            5. index.html の firebaseConfig を更新<br><br>
            <small>詳しくは README.md をご確認ください</small>
          `;
          el("loadingMessage").textContent = "設定が必要です";
          el("spinner").style.display = "none";
          el("errorDetail").innerHTML = msg.innerHTML;
          el("errorDetail").style.display = "block";
          return false;
        }
        return true;
      }

      // Firebase初期化
      let auth, db;
      try{
        if(checkFirebaseConfig()){
          firebase.initializeApp(firebaseConfig);
          auth = firebase.auth();
          db = firebase.firestore();
        }
      }catch(error){
        el("loadingMessage").textContent = "初期化エラー";
        el("spinner").style.display = "none";
        el("errorDetail").textContent = `エラー: ${error.message}`;
        el("errorDetail").style.display = "block";
      }

      const FIXED_PASSWORD = "sayasei3367"; // 固定パスワード
      const STORAGE_KEY = "otd_money_v1";
      const fmtJPY = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });

      const el = (id) => document.getElementById(id);

      const state = {
        data: null,
        viewPeriod: "year", // year | month | all
        viewMode: "home",   // home | list
        user: null,
        unsubscribe: null
      };

      function todayISO(){
        const d = new Date();
        const z = (n)=>String(n).padStart(2,"0");
        return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
      }

      function monthKey(dateISO){ // YYYY-MM
        return (dateISO || "").slice(0,7);
      }
      function yearKey(dateISO){
        return (dateISO || "").slice(0,4);
      }

      function uid(){
        return Math.random().toString(16).slice(2) + Date.now().toString(16);
      }

      function defaultData(){
        return {
          version: 1,
          accounts: [
            { id: "a", name: "さや" },
            { id: "b", name: "せいや" },
          ],
          activeAccountId: "a",
          transactions: [] // {id, accountId, type, date, amount, category, memo, createdAt}
        };
      }

      async function loadFromFirestore(){
        if(!state.user) return defaultData();
        try{
          const docRef = db.collection('users').doc(state.user.uid);
          const doc = await docRef.get();
          if(doc.exists){
            const data = doc.data();
            // 軽い補正
            data.accounts = data.accounts?.length ? data.accounts : defaultData().accounts;
            data.activeAccountId = data.activeAccountId || "a";
            data.transactions = Array.isArray(data.transactions) ? data.transactions : [];
            return data;
          }
          return defaultData();
        }catch(e){
          console.error('Firestore読み込みエラー:', e);
          return defaultData();
        }
      }

      async function saveToFirestore(){
        if(!state.user || !state.data) return;
        try{
          const docRef = db.collection('users').doc(state.user.uid);
          await docRef.set(state.data);
        }catch(e){
          console.error('Firestore保存エラー:', e);
          toast('保存に失敗しました');
        }
      }

      function setupRealtimeSync(){
        if(!state.user) return;
        if(state.unsubscribe) state.unsubscribe();

        const docRef = db.collection('users').doc(state.user.uid);
        state.unsubscribe = docRef.onSnapshot((doc) => {
          if(doc.exists){
            const data = doc.data();
            data.accounts = data.accounts?.length ? data.accounts : defaultData().accounts;
            data.activeAccountId = data.activeAccountId || "a";
            data.transactions = Array.isArray(data.transactions) ? data.transactions : [];
            state.data = data;
            render();
          }
        }, (error) => {
          console.error('リアルタイム同期エラー:', error);
        });
      }

      function toast(msg){
        const t = el("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(()=>t.classList.remove("show"), 1800);
      }

      function activeAccount(){
        return state.data.accounts.find(a => a.id === state.data.activeAccountId) || state.data.accounts[0];
      }

      function filteredTx(accountId, period){
        const tx = state.data.transactions.filter(t => t.accountId === accountId);
        if(period === "all") return tx;
        const now = new Date();
        const nowY = String(now.getFullYear());
        const nowM = String(now.getMonth()+1).padStart(2,"0");
        const nowYM = `${nowY}-${nowM}`;
        if(period === "year") return tx.filter(t => yearKey(t.date) === nowY);
        if(period === "month") return tx.filter(t => monthKey(t.date) === nowYM);
        return tx;
      }

      function sortTxDesc(list){
        return [...list].sort((a,b) => {
          if(a.date !== b.date) return a.date > b.date ? -1 : 1;
          return (b.createdAt||"") > (a.createdAt||"") ? 1 : -1;
        });
      }

      function sums(list){
        let income = 0, expense = 0;
        for(const t of list){
          const amt = Number(t.amount)||0;
          if(t.type === "income") income += amt;
          else expense += amt;
        }
        return { income, expense, balance: income - expense };
      }

      function setActiveAccount(id){
        state.data.activeAccountId = id;
        saveToFirestore();
        render();
      }

      function renderAccountSeg(){
        const seg = el("accountSeg");
        [...seg.querySelectorAll("button")].forEach(btn => {
          const id = btn.dataset.account;
          btn.classList.toggle("active", id === state.data.activeAccountId);
          btn.textContent = state.data.accounts.find(a=>a.id===id)?.name ?? btn.textContent;
          btn.onclick = () => setActiveAccount(id);
        });
      }

      function periodLabel(){
        if(state.viewPeriod === "year") return "今年";
        if(state.viewPeriod === "month") return "今月";
        return "全部";
      }

      function updateMeter(balance, income){
        const bar = el("meterBar");
        const ratio = el("meterRatio");

        if(income <= 0){
          bar.style.width = "0%";
          ratio.textContent = "0%";
          bar.className = "meter-bar";
          return;
        }

        const percent = Math.max(0, Math.min(100, (balance / income) * 100));
        bar.style.width = percent + "%";
        ratio.textContent = Math.round(percent) + "%";

        // 色分け
        bar.className = "meter-bar";
        if(percent < 30){
          bar.classList.add("danger");
        } else if(percent < 60){
          bar.classList.add("warn");
        }
      }

      function renderSummary(){
        const a = activeAccount();
        const list = filteredTx(a.id, state.viewPeriod);
        const s = sums(list);

        el("periodBadge").textContent = periodLabel();
        el("balanceAmt").textContent = fmtJPY.format(s.balance);
        el("incomeSum").textContent = fmtJPY.format(s.income);
        el("expenseSum").textContent = fmtJPY.format(s.expense);

        // メーター更新
        updateMeter(s.balance, s.income);

        const totalCount = state.data.transactions.filter(t=>t.accountId===a.id).length;
        el("countInfo").textContent = `${a.name}：${totalCount}件`;
      }

      function formatRowDate(dateISO){
        if(!dateISO) return "";
        // 表示は M/D
        const m = Number(dateISO.slice(5,7));
        const d = Number(dateISO.slice(8,10));
        return `${m}/${d}`;
      }

      function renderRecent(){
        const a = activeAccount();
        const listAll = sortTxDesc(state.data.transactions.filter(t=>t.accountId===a.id));
        const recent = listAll.slice(0,5);

        const box = el("recentList");
        box.innerHTML = "";
        if(recent.length === 0){
          const empty = document.createElement("div");
          empty.className = "row";
          empty.style.cursor = "default";
          empty.innerHTML = `
            <div class="left">
              <div class="memo" style="max-width:100%">まだ記録がありません</div>
              <div class="date">入金・支出を追加してください</div>
            </div>
            <div class="amt" style="color:var(--muted)">—</div>
          `;
          box.appendChild(empty);
          return;
        }

        for(const t of recent){
          const row = document.createElement("div");
          row.className = "row";
          row.onclick = () => openTxDetail(t.id);

          const memo = (t.memo && t.memo.trim()) ? t.memo.trim() : (t.type === "income" ? "入金" : "支出");
          const cat = (t.type === "expense" && t.category) ? t.category : (t.type === "income" ? "入金" : "支出");
          const sign = t.type === "income" ? "+" : "-";
          row.innerHTML = `
            <div class="left">
              <div class="topline">
                <span class="date">${formatRowDate(t.date)}</span>
                <span class="cat">${escapeHtml(cat)}</span>
                <span class="memo">${escapeHtml(memo)}</span>
              </div>
            </div>
            <div class="amt ${t.type}">${sign}${fmtJPY.format(Number(t.amount)||0)}</div>
          `;
          box.appendChild(row);
        }
      }

      function escapeHtml(s){
        return String(s ?? "")
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }

      function openModal(title, bodyNode, actionsNode){
        el("modalTitle").textContent = title;
        const body = el("modalBody");
        const actions = el("modalActions");
        body.innerHTML = "";
        actions.innerHTML = "";
        body.appendChild(bodyNode);
        actions.appendChild(actionsNode);
        el("modalOverlay").classList.add("show");
        el("modalOverlay").setAttribute("aria-hidden","false");
      }

      function closeModal(){
        el("modalOverlay").classList.remove("show");
        el("modalOverlay").setAttribute("aria-hidden","true");
      }

      function openAdd(type){
        const isIncome = type === "income";
        const wrap = document.createElement("div");

        const grid = document.createElement("div");
        grid.className = "grid";

        const fDate = field("日付", input("date", { value: todayISO() }));
        const fAmt  = field("金額（円）", input("number", { placeholder: "例：3000", inputmode:"numeric", min:"0" }));

        grid.appendChild(fDate);
        grid.appendChild(fAmt);

        wrap.appendChild(grid);

        let fCat = null;
        if(!isIncome){
          const sel = document.createElement("select");
          const cats = ["おもちゃ","本","ゲーム","おかし","外出","貯金","その他"];
          for(const c of cats){
            const opt = document.createElement("option");
            opt.value = c; opt.textContent = c;
            sel.appendChild(opt);
          }
          fCat = field("カテゴリ", sel);
          fCat.classList.add("full");
          wrap.appendChild(fCat);
        }

        const memo = document.createElement("textarea");
        memo.placeholder = isIncome ? "メモ（例：じいじ、ばあば など）" : "メモ（例：レゴ、絵本 など）";
        const fMemo = field("メモ（任意）", memo);
        fMemo.classList.add("full");
        wrap.appendChild(fMemo);

        // プレビューメーター（支出時のみ）
        let previewMeter = null;
        if(!isIncome){
          previewMeter = document.createElement("div");
          previewMeter.className = "preview-meter";
          previewMeter.innerHTML = `
            <div class="title">使ったらあといくら？</div>
            <div class="value" id="previewValue">¥0</div>
            <div class="meter">
              <div class="meter-bar" id="previewBar" style="width:100%"></div>
            </div>
          `;
          wrap.appendChild(previewMeter);

          // リアルタイム計算
          const amtInput = fAmt.querySelector("input");
          amtInput.addEventListener("input", () => {
            const inputAmt = Number(amtInput.value) || 0;
            if(inputAmt > 0){
              const a = activeAccount();
              const list = filteredTx(a.id, state.viewPeriod);
              const s = sums(list);
              const newBalance = s.balance - inputAmt;
              const percent = s.income > 0 ? Math.max(0, Math.min(100, (newBalance / s.income) * 100)) : 0;

              previewMeter.classList.add("show");
              const valueEl = previewMeter.querySelector("#previewValue");
              const barEl = previewMeter.querySelector("#previewBar");

              valueEl.textContent = fmtJPY.format(newBalance);
              valueEl.className = "value " + (newBalance >= 0 ? "positive" : "negative");

              barEl.style.width = percent + "%";
              barEl.className = "meter-bar";
              if(percent < 30){
                barEl.classList.add("danger");
              } else if(percent < 60){
                barEl.classList.add("warn");
              }
            } else {
              previewMeter.classList.remove("show");
            }
          });
        }

        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = "保存すると、残高と明細に反映されます。";
        wrap.appendChild(hint);

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "10px";
        actions.style.width = "100%";

        const cancel = document.createElement("button");
        cancel.className = "btn";
        cancel.textContent = "キャンセル";
        cancel.onclick = closeModal;

        const saveBtn = document.createElement("button");
        saveBtn.className = "btn primary";
        saveBtn.textContent = "保存";
        saveBtn.onclick = () => {
          const date = fDate.querySelector("input").value || todayISO();
          const amount = Number(fAmt.querySelector("input").value);
          if(!Number.isFinite(amount) || amount <= 0){
            toast("金額を入力してください");
            return;
          }
          const tx = {
            id: uid(),
            accountId: state.data.activeAccountId,
            type,
            date,
            amount: Math.floor(amount),
            category: isIncome ? "" : (fCat.querySelector("select").value || ""),
            memo: memo.value || "",
            createdAt: new Date().toISOString()
          };
          state.data.transactions.push(tx);
          saveToFirestore();
          closeModal();
          toast("保存しました");
          render();
        };

        actions.appendChild(cancel);
        actions.appendChild(saveBtn);

        openModal(isIncome ? "入金を追加" : "支出を追加", wrap, actions);
        // autofocus
        setTimeout(()=>fAmt.querySelector("input").focus(), 50);
      }

      function openAllList(){
        const a = activeAccount();
        const wrap = document.createElement("div");

        // toolbar in modal
        const bar = document.createElement("div");
        bar.className = "toolbar";
        bar.style.marginBottom = "8px";

        const chips = document.createElement("div");
        chips.className = "chips";
        const makeChip = (key, label) => {
          const c = document.createElement("button");
          c.type = "button";
          c.className = "chip" + (state.viewPeriod === key ? " active":"");
          c.textContent = label;
          c.onclick = () => {
            state.viewPeriod = key;
            // 再描画（モーダルも更新）
            closeModal();
            openAllList();
            render(); // ホーム側サマリーも合わせる
          };
          return c;
        };
        chips.appendChild(makeChip("year","今年"));
        chips.appendChild(makeChip("month","今月"));
        chips.appendChild(makeChip("all","全部"));

        const right = document.createElement("div");
        right.style.display = "flex";
        right.style.gap = "8px";

        const addIn = document.createElement("button");
        addIn.className = "btn small primary";
        addIn.textContent = "入金";
        addIn.onclick = () => openAdd("income");

        const addEx = document.createElement("button");
        addEx.className = "btn small";
        addEx.textContent = "支出";
        addEx.onclick = () => openAdd("expense");

        right.appendChild(addIn);
        right.appendChild(addEx);

        bar.appendChild(chips);
        bar.appendChild(right);

        wrap.appendChild(bar);

        const listBox = document.createElement("div");
        listBox.className = "card list";

        const list = sortTxDesc(filteredTx(a.id, state.viewPeriod));
        if(list.length === 0){
          const empty = document.createElement("div");
          empty.className = "row";
          empty.style.cursor = "default";
          empty.innerHTML = `
            <div class="left">
              <div class="memo" style="max-width:100%">この期間の記録がありません</div>
              <div class="date">期間を切り替えるか、追加してください</div>
            </div>
            <div class="amt" style="color:var(--muted)">—</div>
          `;
          listBox.appendChild(empty);
        }else{
          for(const t of list){
            const row = document.createElement("div");
            row.className = "row";
            row.onclick = () => openTxDetail(t.id);

            const memo = (t.memo && t.memo.trim()) ? t.memo.trim() : (t.type === "income" ? "入金" : "支出");
            const cat = (t.type === "expense" && t.category) ? t.category : (t.type === "income" ? "入金" : "支出");
            const sign = t.type === "income" ? "+" : "-";
            row.innerHTML = `
              <div class="left">
                <div class="topline">
                  <span class="date">${formatRowDate(t.date)}</span>
                  <span class="cat">${escapeHtml(cat)}</span>
                  <span class="memo">${escapeHtml(memo)}</span>
                </div>
              </div>
              <div class="amt ${t.type}">${sign}${fmtJPY.format(Number(t.amount)||0)}</div>
            `;
            listBox.appendChild(row);
          }
        }

        wrap.appendChild(listBox);

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "10px";
        actions.style.width = "100%";
        const close = document.createElement("button");
        close.className = "btn";
        close.textContent = "閉じる";
        close.onclick = closeModal;
        actions.appendChild(close);

        openModal(`${a.name}の明細（${periodLabel()}）`, wrap, actions);
      }

      function openTxDetail(txId){
        const t = state.data.transactions.find(x => x.id === txId);
        if(!t){ toast("データが見つかりません"); return; }

        const wrap = document.createElement("div");

        const lines = document.createElement("div");
        lines.className = "card";
        lines.style.boxShadow = "none";
        lines.style.background = "var(--card2)";
        lines.style.borderRadius = "14px";
        lines.style.border = "1px solid var(--border)";

        const inner = document.createElement("div");
        inner.className = "inner";
        inner.style.padding = "12px 14px";

        const sign = t.type === "income" ? "+" : "-";
        const cat = (t.type === "expense" && t.category) ? t.category : (t.type === "income" ? "入金" : "支出");
        const memo = (t.memo && t.memo.trim()) ? t.memo.trim() : "—";

        inner.innerHTML = `
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
            <div>
              <div style="color:var(--muted);font-size:12px;font-weight:900">${escapeHtml(t.date)} / ${escapeHtml(cat)}</div>
              <div style="margin-top:6px;font-size:16px;font-weight:900;color:var(--text)">${escapeHtml(memo)}</div>
            </div>
            <div class="amt ${t.type}" style="font-size:16px">${sign}${fmtJPY.format(Number(t.amount)||0)}</div>
          </div>
        `;
        lines.appendChild(inner);
        wrap.appendChild(lines);

        const div = document.createElement("div");
        div.className = "divider";
        wrap.appendChild(div);

        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = "※削除すると元に戻せません（端末内保存）。";
        wrap.appendChild(hint);

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "10px";
        actions.style.width = "100%";

        const back = document.createElement("button");
        back.className = "btn";
        back.textContent = "閉じる";
        back.onclick = closeModal;

        const del = document.createElement("button");
        del.className = "btn danger";
        del.textContent = "削除";
        del.onclick = () => {
          const idx = state.data.transactions.findIndex(x => x.id === txId);
          if(idx >= 0){
            state.data.transactions.splice(idx,1);
            saveToFirestore();
            closeModal();
            toast("削除しました");
            render();
          }
        };

        actions.appendChild(back);
        actions.appendChild(del);

        openModal("明細の詳細", wrap, actions);
      }

      function field(labelText, control){
        const f = document.createElement("div");
        f.className = "field";
        const lab = document.createElement("label");
        lab.textContent = labelText;
        f.appendChild(lab);
        f.appendChild(control);
        return f;
      }
      function input(type, attrs={}){
        const i = document.createElement("input");
        i.type = type;
        Object.entries(attrs).forEach(([k,v]) => i.setAttribute(k, v));
        return i;
      }

      function openBackup(){
        const wrap = document.createElement("div");

        const p = document.createElement("div");
        p.className = "hint";
        p.textContent = "念のため、データをコピーしてメモ等に保存できます。復元もできます。";
        wrap.appendChild(p);

        const ta = document.createElement("textarea");
        ta.placeholder = "ここにデータが表示されます";
        ta.value = JSON.stringify(state.data);
        const fData = field("データ（JSON）", ta);
        fData.classList.add("full");
        wrap.appendChild(fData);

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "10px";
        actions.style.width = "100%";

        const close = document.createElement("button");
        close.className = "btn";
        close.textContent = "閉じる";
        close.onclick = closeModal;

        const copy = document.createElement("button");
        copy.className = "btn primary";
        copy.textContent = "コピー";
        copy.onclick = async () => {
          try{
            await navigator.clipboard.writeText(ta.value);
            toast("コピーしました");
          }catch(e){
            ta.select();
            document.execCommand("copy");
            toast("コピーしました");
          }
        };

        const restore = document.createElement("button");
        restore.className = "btn";
        restore.textContent = "復元";
        restore.onclick = () => {
          try{
            const parsed = JSON.parse(ta.value);
            if(!parsed || typeof parsed !== "object") throw new Error("bad");
            // 最低限の形だけチェック
            if(!Array.isArray(parsed.accounts) || !Array.isArray(parsed.transactions)) throw new Error("shape");
            state.data = parsed;
            saveToFirestore();
            closeModal();
            toast("復元しました");
            render();
          }catch(e){
            toast("復元できません（形式を確認してください）");
          }
        };

        actions.appendChild(close);
        actions.appendChild(copy);
        actions.appendChild(restore);

        openModal("バックアップ", wrap, actions);
      }

      function showMainApp(){
        el("loginScreen").classList.remove("show");
        el("mainApp").style.display = "block";
      }

      // パスワードから固定のメールアドレスを生成
      function passwordToEmail(password){
        return `shared_${password}@otoshidama.local`;
      }

      // 固定パスワードで自動ログイン
      async function autoLogin(){
        if(!auth){
          return;
        }
        const email = passwordToEmail(FIXED_PASSWORD);
        try{
          el("loadingMessage").textContent = "ログイン中...";
          // まずログインを試みる
          await auth.signInWithEmailAndPassword(email, FIXED_PASSWORD);
        }catch(error){
          if(error.code === "auth/user-not-found" || error.code === "auth/invalid-credential"){
            // アカウントが存在しない場合は新規作成
            try{
              el("loadingMessage").textContent = "初回セットアップ中...";
              await auth.createUserWithEmailAndPassword(email, FIXED_PASSWORD);
            }catch(signupError){
              console.error("アカウント作成エラー:", signupError);
              el("loadingMessage").textContent = "エラーが発生しました";
              el("spinner").style.display = "none";
              el("errorDetail").textContent = `アカウント作成エラー: ${signupError.message}`;
              el("errorDetail").style.display = "block";
            }
          }else{
            console.error("ログインエラー:", error);
            el("loadingMessage").textContent = "ログインエラー";
            el("spinner").style.display = "none";
            el("errorDetail").textContent = `エラー: ${error.message}`;
            el("errorDetail").style.display = "block";
          }
        }
      }

      function bindAuth(){
        // 認証状態の監視
        auth.onAuthStateChanged(async (user) => {
          state.user = user;
          if(user){
            state.data = await loadFromFirestore();
            setupRealtimeSync();
            showMainApp();
            render();
          }else{
            // ログインしていない場合は自動ログイン
            autoLogin();
          }
        });
      }

      function bind(){
        el("addIncomeBtn").onclick = () => openAdd("income");
        el("addExpenseBtn").onclick = () => openAdd("expense");
        el("openAllBtn").onclick = openAllList;
        el("backupBtn").onclick = openBackup;

        el("closeModalBtn").onclick = closeModal;
        el("modalOverlay").addEventListener("click", (e) => {
          if(e.target === el("modalOverlay")) closeModal();
        });
      }

      function render(){
        renderAccountSeg();
        renderSummary();
        renderRecent();
      }

      // init
      bindAuth();
      bind();
    })();
  </script>
</body>
</html>
